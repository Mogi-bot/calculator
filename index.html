<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 画面の拡大縮小を禁止し、ホーム画面でアプリ風に起動するための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="計算機">
    <title>計算機</title>
    
    <!-- iPhoneホーム画面用のアイコン設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon-precomposed" href="icon.png">

    <style>
        /* 全体のリセットと拡大・選択の禁止、タッチ遅延の排除 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* 電卓全体のコンテナ */
        .calculator {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            padding: 10px 16px calc(8px + env(safe-area-inset-bottom)) 16px;
        }

        /* 上部ヘッダー */
        .header {
            position: absolute;
            top: calc(8px + env(safe-area-inset-top));
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            z-index: 10;
        }
        .header-btn {
            width: 38px;
            height: 38px;
            background-color: #1c1c1e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
        }
        /* マジシャンモードの隠しMマークおよびN設定モードのNマーク */
        #magic-indicator {
            font-size: 12px;
            color: #333;
            font-weight: bold;
            visibility: hidden;
        }

        /* ディスプレイ部分 */
        .display {
            padding: 5px 6px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex-grow: 1;
            margin-bottom: 50px;
        }
        /* 上段：＝を押した後の結果表示フェイズでのみ式を表示 */
        .formula {
            color: #888;
            font-size: 26px;
            min-height: 32px;
            word-wrap: break-word;
            word-break: break-all;
            margin-bottom: 2px;
            font-weight: 300;
        }
        /* 下段・メイン：計算途中は随時途中式、＝後は計算結果を表示 */
        .result {
            color: #fff;
            font-size: 70px;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        /* ボタンのグリッド構造 */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* ボタンの共通スタイル（数字ボタン） */
        .btn {
            background-color: #333;
            color: #fff;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 400;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        /* タップした瞬間に色が変わるフィードバック */
        .btn:active, .btn.touched {
            background-color: #555;
            opacity: 0.7;
        }

        /* 削除・AC・％ボタン（濃いグレー＆白文字） */
        .btn.function {
            background-color: #505052;
            color: #fff;
            font-size: 38px;
        }
        .btn.function:active, .btn.function.touched {
            background-color: #707072;
        }

        /* 演算子ボタン（右列） */
        .btn.operator {
            background-color: #ff9f0a;
            color: #fff;
            font-size: 50px;
            font-weight: 300;
        }
        .btn.operator:active, .btn.operator.touched {
            background-color: #ffb340;
        }

        .btn.zero {
            grid-column: span 1;
        }

        /* +/-ボタン専用のカスタムスタイル（文字サイズを大きく調整） */
        .pm-symbol {
            position: relative;
            width: 35px;
            height: 35px;
            display: inline-block;
        }
        .pm-plus {
            position: absolute;
            top: 0px;
            left: 0px;
            font-size: 24px;
            font-weight: 400;
            line-height: 1;
        }
        .pm-slash {
            position: absolute;
            top: 16px;
            left: 4.5px;
            width: 30px;
            height: 4px;
            background-color: #fff;
            transform: rotate(-60deg);
        }
        .pm-minus {
            position: absolute;
            bottom: 0px;
            right: 0px;
            font-size: 30px;
            font-weight: 400;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- 左上ボタン（時計アイコン） -->
        <div class="header-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div id="magic-indicator">M</div>
        <!-- 右上ボタン（電卓アイコン：横長ディスプレイ＋3×3円ボタン） -->
        <div class="header-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <!-- 外枠 -->
                <rect x="3.5" y="2.5" width="17" height="19" rx="3.5"/>
                <!-- ディスプレイ（横長長方形） -->
                <rect x="6" y="5" width="12" height="3" rx="1" fill="currentColor"/>
                <!-- 3×3 の円ボタン -->
                <circle cx="8" cy="11.5" r="1" fill="currentColor"/>
                <circle cx="12" cy="11.5" r="1" fill="currentColor"/>
                <circle cx="16" cy="11.5" r="1" fill="currentColor"/>
                <circle cx="8" cy="15" r="1" fill="currentColor"/>
                <circle cx="12" cy="15" r="1" fill="currentColor"/>
                <circle cx="16" cy="15" r="1" fill="currentColor"/>
                <circle cx="8" cy="18.5" r="1" fill="currentColor"/>
                <circle cx="12" cy="18.5" r="1" fill="currentColor"/>
                <circle cx="16" cy="18.5" r="1" fill="currentColor"/>
            </svg>
        </div>
    </div>

    <div class="calculator">
        <div class="display">
            <!-- 上段：＝を押した後の結果表示フェイズでのみ式が表示される -->
            <div class="formula" id="formula"></div>
            <!-- 下段・メイン：計算途中は随時途中式、＝後は計算結果を表示 -->
            <div class="result" id="result">0</div>
        </div>
        
        <div class="buttons">
            <!-- 1段目 -->
            <div class="btn function" data-key="backspace">⌫</div>
            <div class="btn function" id="ac-btn" data-key="AC">AC</div>
            <div class="btn function" data-key="%">%</div>
            <div class="btn operator" id="divide-btn" data-key="÷">÷</div>

            <!-- 2段目 -->
            <div class="btn" data-key="7">7</div>
            <div class="btn" data-key="8">8</div>
            <div class="btn" data-key="9">9</div>
            <div class="btn operator" id="multiply-btn" data-key="×">×</div>

            <!-- 3段目 -->
            <div class="btn" data-key="4">4</div>
            <div class="btn" data-key="5">5</div>
            <div class="btn" data-key="6">6</div>
            <div class="btn operator" data-key="－">－</div>

            <!-- 4段目 -->
            <div class="btn" data-key="1">1</div>
            <div class="btn" data-key="2">2</div>
            <div class="btn" data-key="3">3</div>
            <div class="btn operator" data-key="+">+</div>

            <!-- 5段目：+/-ボタン -->
            <div class="btn" data-key="+/-">
                <div class="pm-symbol">
                    <span class="pm-plus">+</span>
                    <div class="pm-slash"></div>
                    <span class="pm-minus">-</span>
                </div>
            </div>
            <div class="btn zero" data-key="0">0</div>
            <div class="btn" data-key=".">.</div>
            <div class="btn operator" data-key="=">=</div>
        </div>
    </div>

    <script>
        // 状態管理用変数
        let currentInput = "0";      
        let formulaHistory = [];     
        let isResetOnNextKey = false;
        let lastCompletedExpression = ""; 

        // マジシャンモード用変数（デフォルト値：「5941770647653」）
        let isMagicMode = false;     
        let magicNumber = "5941770647653"; 

        // 閾値 N 設定用変数（デフォルト値：100000000）
        let thresholdN = 100000000;
        let isNMode = false;

        // 長押しタイマー用（÷ボタン用、×ボタン用）
        let dividePressTimer = null;
        let multiplyPressTimer = null;
        let isDivideLongPressActioned = false;
        let isMultiplyLongPressActioned = false;

        // iOS用のダブルタップズーム防止
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // AC/Cボタンの表示を切り替える関数
        function updateACButton() {
            const acBtn = document.getElementById("ac-btn");
            if ((currentInput === "0" && formulaHistory.length === 0) || lastCompletedExpression !== "") {
                acBtn.innerText = "AC";
            } else {
                acBtn.innerText = "C";
            }
        }

        // ディスプレイ描画更新
        function updateDisplay() {
            const resEl = document.getElementById("result");
            const formEl = document.getElementById("formula");
            
            let mainDisplayStr = "";
            for (let item of formulaHistory) {
                mainDisplayStr += item;
            }
            mainDisplayStr += currentInput;

            let formattedRes = mainDisplayStr;
            
            if (formulaHistory.length === 0 && !isNaN(currentInput) && currentInput !== "" && !currentInput.includes('e')) {
                const parts = currentInput.split('.');
                parts[0] = Number(parts[0]).toLocaleString('en-US');
                formattedRes = parts.join('.');
            }

            resEl.innerText = formattedRes;
            formEl.innerText = lastCompletedExpression;

            // カンマを除外し、×や＋などの記号を含めた文字数（len）を算出する
            const lenString = formattedRes.replace(/,/g, '');
            const len = lenString.length;

            // 文字数に応じたフォントサイズの微調整
            if (len >= 22) {
                resEl.style.fontSize = "20px";
            } else if (len >= 18) {
                resEl.style.fontSize = "28px";
            } else if (len >= 15) {
                resEl.style.fontSize = "38px"; 
            } else if (len >= 10) {
                resEl.style.fontSize = "38px";
            } else if (len >= 7) {
                resEl.style.fontSize = "60px";
            } else {
                resEl.style.fontSize = "70px";
            }

            // AC/C表示の更新を連動
            updateACButton();
        }

        // マジシャンモードの切り替え処理（÷ボタン長押し）
        function toggleMagicMode() {
            if (isNMode) return; // N設定モード中は切り替えない

            const indicator = document.getElementById("magic-indicator");
            if (!isMagicMode) {
                isMagicMode = true;
                indicator.innerText = "M";
                indicator.style.visibility = "visible";
                if (magicNumber !== null) {
                    currentInput = magicNumber;
                } else {
                    currentInput = "0";
                }
                formulaHistory = [];
                lastCompletedExpression = "";
            } else {
                isMagicMode = false;
                indicator.style.visibility = "hidden";
                if (currentInput === "0" || currentInput === "") {
                    magicNumber = null;
                } else {
                    magicNumber = currentInput;
                }
                currentInput = "0";
                formulaHistory = [];
                lastCompletedExpression = "";
            }
            updateDisplay();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // 閾値 N 設定モードの切り替え処理（×ボタン長押し）
        function toggleNMode() {
            if (isMagicMode) return; // マジシャンモード中は切り替えない

            const indicator = document.getElementById("magic-indicator");
            if (!isNMode) {
                isNMode = true;
                indicator.innerText = "N";
                indicator.style.visibility = "visible";
                currentInput = String(thresholdN);
                formulaHistory = [];
                lastCompletedExpression = "";
            } else {
                isNMode = false;
                indicator.style.visibility = "hidden";
                let parsedN = parseFloat(currentInput);
                if (!isNaN(parsedN) && parsedN >= 0) {
                    thresholdN = parsedN;
                }
                currentInput = "0";
                formulaHistory = [];
                lastCompletedExpression = "";
            }
            updateDisplay();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // キー入力メインルーティン
        function handleKey(key) {
            if (isNMode) {
                handleNInput(key);
                return;
            }
            if (isMagicMode) {
                handleMagicInput(key);
                return;
            }
            handleNormalInput(key);
        }

        // 閾値 N 設定モード中の入力処理
        function handleNInput(key) {
            if (!isNaN(key) || key === '.') {
                if (currentInput === "0" && key !== '.') {
                    currentInput = key;
                } else {
                    if (key === '.' && currentInput.includes('.')) return;
                    currentInput += key;
                }
            } else if (key === 'AC') {
                currentInput = "0";
            } else if (key === 'backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = "0";
                }
            }
            updateDisplay();
        }

        // マジシャンモード中の操作
        function handleMagicInput(key) {
            if (!isNaN(key) || key === '.') {
                if (currentInput === "0" && key !== '.') {
                    currentInput = key;
                } else {
                    if (key === '.' && currentInput.includes('.')) return;
                    currentInput += key;
                }
            } else if (key === 'AC') {
                currentInput = "0";
            } else if (key === 'backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = "0";
                }
            } else if (key === '+/-') {
                if (currentInput !== "0") {
                    currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                }
            }
            updateDisplay();
        }

        // 通常モード時の計算処理
        function handleNormalInput(key) {
            if (lastCompletedExpression !== "" && (!isNaN(key) || key === '.')) {
                formulaHistory = [];
                currentInput = "0";
                lastCompletedExpression = "";
            }

            if (!isNaN(key)) {
                if (currentInput === "0" || isResetOnNextKey) {
                    currentInput = key;
                    isResetOnNextKey = false;
                } else {
                    currentInput += key;
                }
            } else if (key === '.') {
                if (isResetOnNextKey) {
                    currentInput = "0.";
                    isResetOnNextKey = false;
                    updateDisplay();
                    return;
                }
                if (!currentInput.includes('.')) {
                    currentInput += '.';
                }
            } else if (key === 'AC') {
                currentInput = "0";
                formulaHistory = [];
                lastCompletedExpression = "";
                isResetOnNextKey = false;
            } else if (key === 'backspace') {
                if (!isResetOnNextKey && currentInput.length > 0) {
                    if (currentInput.length > 1) {
                        currentInput = currentInput.slice(0, -1);
                    } else {
                        currentInput = "0";
                    }
                }
            } else if (key === '+/-') {
                if (currentInput !== "0") {
                    currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                }
            } else if (key === '%') {
                // 演算子直後に % を押した場合の修正
                if (isResetOnNextKey && formulaHistory.length >= 2) {
                    formulaHistory.pop(); // 演算子を除去
                    let targetVal = formulaHistory.pop(); // 前の数値を取り出す
                    currentInput = String(parseFloat(targetVal) / 100);
                    isResetOnNextKey = false;
                } else if (currentInput !== "") {
                    currentInput = String(parseFloat(currentInput) / 100);
                }
            } else if (['+', '－', '×', '÷'].includes(key)) {
                lastCompletedExpression = "";
                if (isResetOnNextKey && formulaHistory.length > 0) {
                    formulaHistory[formulaHistory.length - 1] = key;
                } else {
                    formulaHistory.push(currentInput);
                    formulaHistory.push(key);
                }
                currentInput = "";
                isResetOnNextKey = true;
            } else if (key === '=') {
                if (formulaHistory.length > 0 || currentInput !== "") {
                    let fullExpressionStr = "";
                    for (let item of formulaHistory) {
                        fullExpressionStr += item;
                    }
                    fullExpressionStr += currentInput;

                    let realResult = calculateSafe(fullExpressionStr);

                    // 設定した閾値 thresholdN より大きい場合に指定数値へ書き換え
                    if (magicNumber !== null && (realResult === "Error" || realResult > thresholdN)) {
                        currentInput = magicNumber;
                    } else {
                        currentInput = String(realResult);
                    }

                    lastCompletedExpression = fullExpressionStr + " =";
                    formulaHistory = [];
                    isResetOnNextKey = true;
                }
            }
            updateDisplay();
        }

        // 安全な計算用ヘルパー
        function calculateSafe(exprStr) {
            try {
                let sanitized = exprStr
                    .replace(/×/g, '*')
                    .replace(/－/g, '-')
                    .replace(/÷/g, '/');
                
                let ans = Function('"use strict"; return (' + sanitized + ')')();
                if (!isFinite(ans)) return "Error";
                return Math.round(ans * 100000000) / 100000000;
            } catch (e) {
                return "Error";
            }
        }

        // 高速化対応：遅延のない touchstart / mousedown イベントのバインド
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            const key = button.getAttribute('data-key');

            if (key === '÷') {
                // ÷ ボタンの長押し（マジシャンモード切り替え）
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    isDivideLongPressActioned = false;
                    dividePressTimer = setTimeout(() => {
                        toggleMagicMode();
                        isDivideLongPressActioned = true;
                    }, 2000);
                }, { passive: false });

                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    clearTimeout(dividePressTimer);
                    if (!isDivideLongPressActioned) {
                        handleKey('÷');
                    }
                });

                button.addEventListener('mousedown', (e) => {
                    isDivideLongPressActioned = false;
                    dividePressTimer = setTimeout(() => {
                        toggleMagicMode();
                        isDivideLongPressActioned = true;
                    }, 2000);
                });
                button.addEventListener('mouseup', (e) => {
                    clearTimeout(dividePressTimer);
                    if (!isDivideLongPressActioned) {
                        handleKey('÷');
                    }
                });
            } else if (key === '×') {
                // × ボタンの長押し（閾値 N 設定モード切り替え）
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    isMultiplyLongPressActioned = false;
                    multiplyPressTimer = setTimeout(() => {
                        toggleNMode();
                        isMultiplyLongPressActioned = true;
                    }, 2000);
                }, { passive: false });

                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    clearTimeout(multiplyPressTimer);
                    if (!isMultiplyLongPressActioned) {
                        handleKey('×');
                    }
                });

                button.addEventListener('mousedown', (e) => {
                    isMultiplyLongPressActioned = false;
                    multiplyPressTimer = setTimeout(() => {
                        toggleNMode();
                        isMultiplyLongPressActioned = true;
                    }, 2000);
                });
                button.addEventListener('mouseup', (e) => {
                    clearTimeout(multiplyPressTimer);
                    if (!isMultiplyLongPressActioned) {
                        handleKey('×');
                    }
                });
            } else {
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    button.classList.add('touched');
                    handleKey(key);
                }, { passive: false });

                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    button.classList.remove('touched');
                }, { passive: false });

                button.addEventListener('mousedown', () => {
                    handleKey(key);
                });
            }
        });

        // 初期化
        updateDisplay();
    </script>
</body>
</html>
