<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 画面の拡大縮小を禁止し、ホーム画面でアプリ風に起動するための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="電卓">
    <title>電卓</title>
    
    <!-- iPhoneホーム画面用のアイコン設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon-precomposed" href="icon.png">

    <style>
        /* 全体のリセットと拡大・選択の禁止 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* 電卓全体のコンテナ（配置をもう少し下にずらすため下部余白を調整） */
        .calculator {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            padding: 20px 16px calc(35px + env(safe-area-inset-bottom)) 16px;
        }

        /* 上部ヘッダー */
        .header {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            z-index: 10;
        }
        .header-btn {
            width: 38px;
            height: 38px;
            background-color: #1c1c1e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
        }
        /* マジシャンモードの隠しMマーク */
        #magic-indicator {
            font-size: 12px;
            color: #333;
            font-weight: bold;
            visibility: hidden;
        }

        /* ディスプレイ部分 */
        .display {
            padding: 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex-grow: 1;
            margin-bottom: 10px;
        }
        .formula {
            color: #888;
            font-size: 28px;
            min-height: 36px;
            word-wrap: break-word;
            word-break: break-all;
            margin-bottom: 5px;
            font-weight: 300;
        }
        .result {
            color: #fff;
            font-size: 70px;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        /* ボタンのグリッド構造（ボタンを少し大きくするため隙間を狭く調整） */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* ボタンの共通スタイル（ボタンサイズを拡大・文字も拡大） */
        .btn {
            background-color: #333;
            color: #fff;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px; /* 文字サイズを大きめに変更 */
            font-weight: 400;
            cursor: pointer;
            transition: opacity 0.1s;
        }
        .btn:active {
            opacity: 0.6;
        }

        /* 削除・AC・％ボタン（ご要望の濃いグレー＆白文字） */
        .btn.function {
            background-color: #505052; /* 通常数字ボタン(#333)よりわずかに薄い、絶妙な濃いグレー */
            color: #fff;               /* 文字色は白に変更 */
            font-size: 30px;
        }

        /* 演算子ボタン（右列：÷, ×, －, ＋, ＝） */
        .btn.operator {
            background-color: #ff9f0a;
            color: #fff;
            font-size: 42px;
        }

        .btn.zero {
            grid-column: span 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div id="magic-indicator">M</div>
        <div class="header-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>
        </div>
    </div>

    <div class="calculator">
        <div class="display">
            <div class="formula" id="formula"></div>
            <div class="result" id="result">0</div>
        </div>
        
        <div class="buttons">
            <!-- 1段目 -->
            <div class="btn function" onclick="handleKey('backspace')">⌫</div>
            <div class="btn function" onclick="handleKey('AC')">AC</div>
            <div class="btn function" onclick="handleKey('%')">%</div>
            <div class="btn operator" id="divide-btn" 
                 typeof="button"
                 ontouchstart="startPress(event)" 
                 onmousedown="startPress(event)"
                 ontouchend="endPress(event)" 
                 onmouseup="endPress(event)">÷</div>

            <!-- 2段目 -->
            <div class="btn" onclick="handleKey('7')">7</div>
            <div class="btn" onclick="handleKey('8')">8</div>
            <div class="btn" onclick="handleKey('9')">9</div>
            <div class="btn operator" onclick="handleKey('×')">×</div>

            <!-- 3段目 -->
            <div class="btn" onclick="handleKey('4')">4</div>
            <div class="btn" onclick="handleKey('5')">5</div>
            <div class="btn" onclick="handleKey('6')">6</div>
            <div class="btn operator" onclick="handleKey('－')">－</div>

            <!-- 4段目 -->
            <div class="btn" onclick="handleKey('1')">1</div>
            <div class="btn" onclick="handleKey('2')">2</div>
            <div class="btn" onclick="handleKey('3')">3</div>
            <div class="btn operator" onclick="handleKey('+')">+</div>

            <!-- 5段目 -->
            <div class="btn" onclick="handleKey('+/-')">+/-</div>
            <div class="btn zero" onclick="handleKey('0')">0</div>
            <div class="btn" onclick="handleKey('.')">.</div>
            <div class="btn operator" onclick="handleKey('=')">=</div>
        </div>
    </div>

    <script>
        // 状態管理用変数
        let currentInput = "0";      
        let formulaHistory = [];     // 複数の数や演算子を順番に保持する配列
        let isResetOnNextKey = false;

        // マジック用変数
        let isMagicMode = false;     
        let magicNumber = null;      

        // 長押しタイマー用
        let pressTimer = null;
        let isLongPressActioned = false;

        // iOS用のダブルタップズーム防止
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // ディスプレイ描画・計算式表示更新
        function updateDisplay() {
            const resEl = document.getElementById("result");
            const formEl = document.getElementById("formula");
            
            // カンマ区切り整形
            let formatted = currentInput;
            if (!isNaN(currentInput) && currentInput !== "" && !currentInput.includes('e')) {
                const parts = currentInput.split('.');
                parts[0] = Number(parts[0]).toLocaleString('en-US');
                formatted = parts.join('.');
            }
            
            resEl.innerText = formatted;

            // ご要望通りのリアルタイム計算式文字列の構築（例: 96×65×）
            let formulaStr = "";
            for (let item of formulaHistory) {
                formulaStr += item;
            }
            formulaStr += currentInput;
            formEl.innerText = formulaStr;

            // 文字数に応じたフォントサイズ自動調整
            if (formatted.length > 10) {
                resEl.style.fontSize = "40px";
            } else if (formatted.length > 7) {
                resEl.style.fontSize = "55px";
            } else {
                resEl.style.fontSize = "70px";
            }
        }

        // ÷ボタン長押し検知 (2秒)
        function startPress(e) {
            e.preventDefault();
            isLongPressActioned = false;
            pressTimer = setTimeout(() => {
                toggleMagicMode();
                isLongPressActioned = true;
            }, 2000);
        }

        function endPress(e) {
            clearTimeout(pressTimer);
            if (!isLongPressActioned) {
                handleKey('÷');
            }
        }

        // モードの切り替え処理
        function toggleMagicMode() {
            if (!isMagicMode) {
                isMagicMode = true;
                document.getElementById("magic-indicator").style.visibility = "visible";
                if (magicNumber !== null) {
                    currentInput = magicNumber;
                } else {
                    currentInput = "0";
                }
                formulaHistory = [];
            } else {
                isMagicMode = false;
                document.getElementById("magic-indicator").style.visibility = "hidden";
                if (currentInput === "0" || currentInput === "") {
                    magicNumber = null;
                } else {
                    magicNumber = currentInput;
                }
                currentInput = "0";
                formulaHistory = [];
            }
            updateDisplay();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // キー入力メインルーティン
        function handleKey(key) {
            if (isMagicMode) {
                handleMagicInput(key);
                return;
            }
            handleNormalInput(key);
        }

        // マジシャンモード中の操作
        function handleMagicInput(key) {
            if (!isNaN(key) || key === '.') {
                if (currentInput === "0" && key !== '.') {
                    currentInput = key;
                } else {
                    if (key === '.' && currentInput.includes('.')) return;
                    currentInput += key;
                }
            } else if (key === 'AC') {
                currentInput = "0";
            } else if (key === 'backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = "0";
                }
            } else if (key === '+/-') {
                if (currentInput !== "0") {
                    currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                }
            }
            updateDisplay();
        }

        // 通常モード時の計算・複数演算対応処理
        function handleNormalInput(key) {
            if (!isNaN(key)) {
                if (currentInput === "0" || isResetOnNextKey) {
                    currentInput = key;
                    isResetOnNextKey = false;
                } else {
                    currentInput += key;
                }
            } else if (key === '.') {
                if (isResetOnNextKey) {
                    currentInput = "0.";
                    isResetOnNextKey = false;
                    updateDisplay();
                    return;
                }
                if (!currentInput.includes('.')) {
                    currentInput += '.';
                }
            } else if (key === 'AC') {
                currentInput = "0";
                formulaHistory = [];
                isResetOnNextKey = false;
            } else if (key === 'backspace') {
                if (!isResetOnNextKey && currentInput.length > 0) {
                    if (currentInput.length > 1) {
                        currentInput = currentInput.slice(0, -1);
                    } else {
                        currentInput = "0";
                    }
                }
            } else if (key === '+/-') {
                if (currentInput !== "0") {
                    currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                }
            } else if (key === '%') {
                currentInput = String(parseFloat(currentInput) / 100);
            } else if (['+', '－', '×', '÷'].includes(key)) {
                // 連続計算に対応：履歴に現在の入力値と演算子を追加していく
                formulaHistory.push(currentInput);
                formulaHistory.push(key);
                isResetOnNextKey = true;
            } else if (key === '=') {
                // ＝が押されたとき
                // 演算子のあとに入力値がないまま＝が押された場合のケア
                let fullExpressionStr = "";
                for (let item of formulaHistory) {
                    fullExpressionStr += item;
                }
                fullExpressionStr += currentInput;

                if (formulaHistory.length > 0) {
                    // 1. まず本来の正しい計算結果を算術的に算出する（複数項目対応）
                    let realResult = calculateSafe(fullExpressionStr);

                    // 2. 300以下の判定ロジック
                    if (magicNumber !== null && (realResult === "Error" || realResult > 300)) {
                        // マジックナンバーが設定されており、かつ結果が300を超える場合はすり替える
                        currentInput = magicNumber;
                    } else {
                        // マジックナンバー未設定、または300以下の安全値なら正しい結果を返す
                        currentInput = String(realResult);
                    }

                    formulaHistory = [];
                    isResetOnNextKey = true;
                }
            }
            updateDisplay();
        }

        // 文字列の数式（例: "96*65*12" 等）を安全に計算するヘルパー関数
        function calculateSafe(exprStr) {
            try {
                // 画面上の演算子記号をJavaScriptの演算子に置換
                let sanitized = exprStr
                    .replace(/×/g, '*')
                    .replace(/－/g, '-')
                    .replace(/÷/g, '/');
                
                // 安全な範囲で評価
                let ans = Function('"use strict"; return (' + sanitized + ')')();
                if (!isFinite(ans)) return "Error";
                // 小数点以下の長すぎる端数を丸める（必要に応じて）
                return Math.round(ans * 100000000) / 100000000;
            } catch (e) {
                return "Error";
            }
        }

        // 初期化
        updateDisplay();
    </script>
</body>
</html>
